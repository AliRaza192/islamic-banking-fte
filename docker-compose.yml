# docker-compose.yml — Islamic Banking FTE
# Usage: docker compose up --build
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./api:/app/api
      - ./web:/app/web
      - ./skills:/app/skills
      - ./references:/app/references
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
