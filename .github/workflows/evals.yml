name: Islamic Banking FTE — Evals Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure-validation:
    name: Validate Structure & Routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate routing golden files
        run: python3 evals/run-evals.py

      - name: Validate routing logic
        run: python3 scripts/validate-routing.py

  skill-coverage:
    name: Skill Coverage Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check all skills have SKILL.md
        run: |
          SKILLS_DIR="skills"
          MISSING=0
          for dir in "$SKILLS_DIR"/*/; do
            if [ ! -f "$dir/SKILL.md" ]; then
              echo "MISSING: $dir/SKILL.md"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "ERROR: $MISSING skills missing SKILL.md"
            exit 1
          fi
          echo "All skills have SKILL.md files"

      - name: Check all jurisdiction overlays exist
        run: |
          JURIS_DIR="skills/islamic-finance-router/references/jurisdictions"
          EXPECTED=("pakistan-ifrs" "uae-ifrs" "saudi-ifrs" "malaysia-mfrs" "bahrain-aaoifi" "kuwait-ifrs" "qatar-aaoifi" "oman-ifrs" "turkey-tfrs" "nigeria-ifrs" "indonesia-psak" "uk-ifrs" "gcc-crossborder")
          MISSING=0
          for j in "${EXPECTED[@]}"; do
            if [ ! -f "$JURIS_DIR/$j.md" ]; then
              echo "MISSING: $JURIS_DIR/$j.md"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "ERROR: $MISSING jurisdiction overlays missing"
            exit 1
          fi
          echo "All 13 jurisdiction overlays present"

  api-syntax:
    name: API Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Node.js syntax for API files
        run: |
          for f in api/*.js api/auth/*.js; do
            echo "Checking $f..."
            node --check "$f" || exit 1
          done
          echo "All API files pass syntax check"

      - name: Check frontend JS syntax
        run: |
          for f in web/*.js web/js/*.js; do
            echo "Checking $f..."
            node --check "$f" || exit 1
          done
          echo "All frontend JS files pass syntax check"
