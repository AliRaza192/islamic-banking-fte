<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Islamic Banking FTE Admin Dashboard — User analytics, revenue tracking, rate management." />
  <title>Admin — Islamic Banking FTE</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0f1f16; color: #e8f5e9; font-family: var(--font-sans, system-ui, sans-serif); margin: 0; padding: 0; min-height: 100vh; }
    .admin-wrap { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .admin-title { font-size: 18px; font-weight: 500; color: #a5d6a7; }
    .admin-subtitle { font-size: 12px; color: #4a7a5a; margin-top: 2px; }
    .login-card { background: #1a3a27; border: .5px solid #2a5a3a; border-radius: 12px; padding: 2rem; max-width: 400px; margin: 4rem auto; }
    .login-title { font-size: 16px; font-weight: 500; margin-bottom: 1.5rem; color: #a5d6a7; }
    .admin-input { width: 100%; padding: .65rem .85rem; background: #0f2a1a; border: .5px solid #2a5a3a; border-radius: 8px; color: #e8f5e9; font-size: 14px; box-sizing: border-box; margin-bottom: 1rem; outline: none; }
    .admin-input:focus { border-color: #4caf50; }
    .admin-btn { width: 100%; padding: .65rem; background: #2e7d32; border: none; border-radius: 8px; color: white; font-size: 14px; font-weight: 500; cursor: pointer; }
    .admin-btn:hover { background: #388e3c; }
    .admin-btn:disabled { opacity: .5; cursor: not-allowed; }
    .err-msg { color: #ef9a9a; font-size: 13px; margin-top: .5rem; text-align: center; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .stat-card { background: #1a3a27; border: .5px solid #2a5a3a; border-radius: 10px; padding: 1rem 1.25rem; }
    .stat-label { font-size: 11px; color: #4a9a6a; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .stat-value { font-size: 28px; font-weight: 500; color: #a5d6a7; }
    .stat-sub { font-size: 12px; color: #4a7a5a; margin-top: 2px; }
    .section { background: #1a3a27; border: .5px solid #2a5a3a; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
    .section-title { font-size: 12px; color: #4a9a6a; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1rem; border-bottom: .5px solid #2a5a3a; padding-bottom: .5rem; }
    .data-row { display: flex; justify-content: space-between; align-items: center; padding: .4rem 0; border-bottom: .5px solid #1a2a1f; font-size: 13px; }
    .data-row:last-child { border-bottom: none; }
    .data-key { color: #8ac994; }
    .data-val { color: #e8f5e9; font-weight: 500; }
    .badge-tier { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
    .badge-free { background: #1a3a27; color: #4a9a6a; border: .5px solid #2a5a3a; }
    .badge-premium { background: #1a2a3a; color: #64b5f6; border: .5px solid #1a4a6a; }
    .badge-professional { background: #2a1a3a; color: #ce93d8; border: .5px solid #4a1a6a; }
    .bar-wrap { height: 4px; background: #0f2a1a; border-radius: 2px; margin-top: 4px; }
    .bar-fill { height: 4px; border-radius: 2px; background: #4caf50; }
    #loginSection { display: block; }
    #dashSection { display: none; }
    .refresh-btn { font-size: 12px; background: none; border: .5px solid #2a5a3a; border-radius: 6px; padding: 4px 10px; color: #4a9a6a; cursor: pointer; }
    .refresh-btn:hover { border-color: #4caf50; color: #a5d6a7; }
    .gen-at { font-size: 11px; color: #3a6a4a; }
    .chart-bars { display: flex; align-items: flex-end; gap: 4px; height: 60px; margin-top: .5rem; }
    .chart-bar { flex: 1; background: #2e7d32; border-radius: 2px 2px 0 0; min-width: 8px; position: relative; }
    .chart-label { font-size: 9px; color: #3a6a4a; text-align: center; margin-top: 3px; }
  </style>
</head>
<body>

<!-- LOGIN SECTION -->
<div id="loginSection">
  <div class="admin-wrap">
    <div class="login-card">
      <div class="login-title">🕌 Admin Dashboard</div>
      <input type="password" id="adminKey" class="admin-input" placeholder="Admin password" autocomplete="current-password">
      <button class="admin-btn" onclick="adminLogin()">Login</button>
      <div class="err-msg" id="loginErr"></div>
    </div>
  </div>
</div>

<!-- DASHBOARD SECTION -->
<div id="dashSection">
  <div class="admin-wrap">
    <div class="admin-header">
      <div>
        <div class="admin-title">🕌 Islamic Banking FTE — Admin</div>
        <div class="admin-subtitle gen-at" id="genAt"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="refresh-btn" onclick="loadDash()">↻ Refresh</button>
        <button class="refresh-btn" onclick="adminLogout()">Logout</button>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="s-total">—</div></div>
      <div class="stat-card"><div class="stat-label">New Today</div><div class="stat-value" id="s-today">—</div></div>
      <div class="stat-card"><div class="stat-label">Queries Today</div><div class="stat-value" id="s-queries">—</div></div>
      <div class="stat-card"><div class="stat-label">Monthly Revenue</div><div class="stat-value" id="s-revenue">—</div><div class="stat-sub" id="s-revenue-pkr"></div></div>
    </div>

    <!-- Tier Breakdown -->
    <div class="section" id="tierSection">
      <div class="section-title">Users by Plan</div>
      <div id="tierList"></div>
    </div>

    <!-- Query Chart -->
    <div class="section">
      <div class="section-title">Queries — Last 7 Days</div>
      <div class="chart-bars" id="queryChart"></div>
      <div style="display:flex;gap:4px;margin-top:4px" id="queryChartLabels"></div>
    </div>

    <!-- Top Skills -->
    <div class="section">
      <div class="section-title">Top Skills Used (30 days)</div>
      <div id="skillsList"></div>
    </div>

    <!-- Recent Users -->
    <div class="section">
      <div class="section-title">Recent Users</div>
      <div id="usersList"></div>
    </div>

    <!-- Active Subscriptions -->
    <div class="section">
      <div class="section-title">Active Subscriptions</div>
      <div id="subsList"></div>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
