<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Islamic Banking FTE</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #0f1f16; color: #e8f5e9; font-family: var(--font-sans, system-ui, sans-serif); margin: 0; padding: 0; min-height: 100vh; }
    .admin-wrap { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .admin-title { font-size: 18px; font-weight: 500; color: #a5d6a7; }
    .admin-subtitle { font-size: 12px; color: #4a7a5a; margin-top: 2px; }
    .login-card { background: #1a3a27; border: .5px solid #2a5a3a; border-radius: 12px; padding: 2rem; max-width: 400px; margin: 4rem auto; }
    .login-title { font-size: 16px; font-weight: 500; margin-bottom: 1.5rem; color: #a5d6a7; }
    .admin-input { width: 100%; padding: .65rem .85rem; background: #0f2a1a; border: .5px solid #2a5a3a; border-radius: 8px; color: #e8f5e9; font-size: 14px; box-sizing: border-box; margin-bottom: 1rem; outline: none; }
    .admin-input:focus { border-color: #4caf50; }
    .admin-btn { width: 100%; padding: .65rem; background: #2e7d32; border: none; border-radius: 8px; color: white; font-size: 14px; font-weight: 500; cursor: pointer; }
    .admin-btn:hover { background: #388e3c; }
    .admin-btn:disabled { opacity: .5; cursor: not-allowed; }
    .err-msg { color: #ef9a9a; font-size: 13px; margin-top: .5rem; text-align: center; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
    .stat-card { background: #1a3a27; border: .5px solid #2a5a3a; border-radius: 10px; padding: 1rem 1.25rem; }
    .stat-label { font-size: 11px; color: #4a9a6a; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .stat-value { font-size: 28px; font-weight: 500; color: #a5d6a7; }
    .stat-sub { font-size: 12px; color: #4a7a5a; margin-top: 2px; }
    .section { background: #1a3a27; border: .5px solid #2a5a3a; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
    .section-title { font-size: 12px; color: #4a9a6a; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 1rem; border-bottom: .5px solid #2a5a3a; padding-bottom: .5rem; }
    .data-row { display: flex; justify-content: space-between; align-items: center; padding: .4rem 0; border-bottom: .5px solid #1a2a1f; font-size: 13px; }
    .data-row:last-child { border-bottom: none; }
    .data-key { color: #8ac994; }
    .data-val { color: #e8f5e9; font-weight: 500; }
    .badge-tier { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
    .badge-free { background: #1a3a27; color: #4a9a6a; border: .5px solid #2a5a3a; }
    .badge-premium { background: #1a2a3a; color: #64b5f6; border: .5px solid #1a4a6a; }
    .badge-professional { background: #2a1a3a; color: #ce93d8; border: .5px solid #4a1a6a; }
    .bar-wrap { height: 4px; background: #0f2a1a; border-radius: 2px; margin-top: 4px; }
    .bar-fill { height: 4px; border-radius: 2px; background: #4caf50; }
    #loginSection { display: block; }
    #dashSection { display: none; }
    .refresh-btn { font-size: 12px; background: none; border: .5px solid #2a5a3a; border-radius: 6px; padding: 4px 10px; color: #4a9a6a; cursor: pointer; }
    .refresh-btn:hover { border-color: #4caf50; color: #a5d6a7; }
    .gen-at { font-size: 11px; color: #3a6a4a; }
    .chart-bars { display: flex; align-items: flex-end; gap: 4px; height: 60px; margin-top: .5rem; }
    .chart-bar { flex: 1; background: #2e7d32; border-radius: 2px 2px 0 0; min-width: 8px; position: relative; }
    .chart-label { font-size: 9px; color: #3a6a4a; text-align: center; margin-top: 3px; }
  </style>
</head>
<body>

<!-- LOGIN SECTION -->
<div id="loginSection">
  <div class="admin-wrap">
    <div class="login-card">
      <div class="login-title">🕌 Admin Dashboard</div>
      <input type="password" id="adminKey" class="admin-input" placeholder="Admin password" autocomplete="current-password">
      <button class="admin-btn" onclick="adminLogin()">Login</button>
      <div class="err-msg" id="loginErr"></div>
    </div>
  </div>
</div>

<!-- DASHBOARD SECTION -->
<div id="dashSection">
  <div class="admin-wrap">
    <div class="admin-header">
      <div>
        <div class="admin-title">🕌 Islamic Banking FTE — Admin</div>
        <div class="admin-subtitle gen-at" id="genAt"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="refresh-btn" onclick="loadDash()">↻ Refresh</button>
        <button class="refresh-btn" onclick="adminLogout()">Logout</button>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-label">Total Users</div><div class="stat-value" id="s-total">—</div></div>
      <div class="stat-card"><div class="stat-label">New Today</div><div class="stat-value" id="s-today">—</div></div>
      <div class="stat-card"><div class="stat-label">Queries Today</div><div class="stat-value" id="s-queries">—</div></div>
      <div class="stat-card"><div class="stat-label">Monthly Revenue</div><div class="stat-value" id="s-revenue">—</div><div class="stat-sub" id="s-revenue-pkr"></div></div>
    </div>

    <!-- Tier Breakdown -->
    <div class="section" id="tierSection">
      <div class="section-title">Users by Plan</div>
      <div id="tierList"></div>
    </div>

    <!-- Query Chart -->
    <div class="section">
      <div class="section-title">Queries — Last 7 Days</div>
      <div class="chart-bars" id="queryChart"></div>
      <div style="display:flex;gap:4px;margin-top:4px" id="queryChartLabels"></div>
    </div>

    <!-- Top Skills -->
    <div class="section">
      <div class="section-title">Top Skills Used (30 days)</div>
      <div id="skillsList"></div>
    </div>

    <!-- Recent Users -->
    <div class="section">
      <div class="section-title">Recent Users</div>
      <div id="usersList"></div>
    </div>

    <!-- Active Subscriptions -->
    <div class="section">
      <div class="section-title">Active Subscriptions</div>
      <div id="subsList"></div>
    </div>
  </div>
</div>

<script>
let _adminKey = sessionStorage.getItem('ib_admin_key') || '';

function adminLogin() {
  const key = document.getElementById('adminKey').value.trim();
  if (!key) return;
  _adminKey = key;
  sessionStorage.setItem('ib_admin_key', key);
  loadDash();
}

function adminLogout() {
  sessionStorage.removeItem('ib_admin_key');
  _adminKey = '';
  document.getElementById('loginSection').style.display = 'block';
  document.getElementById('dashSection').style.display  = 'none';
}

document.getElementById('adminKey')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') adminLogin();
});

async function loadDash() {
  document.getElementById('loginErr').textContent = '';
  try {
    const res = await fetch('/api/admin', {
      headers: { 'Authorization': `Bearer ${_adminKey}` }
    });
    if (res.status === 401) {
      document.getElementById('loginErr').textContent = 'Wrong password';
      sessionStorage.removeItem('ib_admin_key');
      return;
    }
    if (!res.ok) throw new Error('Server error');

    const d = await res.json();

    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('dashSection').style.display  = 'block';
    document.getElementById('genAt').textContent = 'Updated: ' + new Date(d.generated_at).toLocaleString('en-PK');

    // Stats
    document.getElementById('s-total').textContent   = d.users.total.toLocaleString();
    document.getElementById('s-today').textContent   = '+' + d.users.new_today;
    document.getElementById('s-queries').textContent = d.queries.today.toLocaleString();
    document.getElementById('s-revenue').textContent = '$' + d.revenue.estimated_monthly_usd;
    document.getElementById('s-revenue-pkr').textContent = '≈ PKR ' + (d.revenue.estimated_monthly_pkr || 0).toLocaleString();

    // Tier breakdown
    const total = d.users.total || 1;
    document.getElementById('tierList').innerHTML = d.users.by_tier.map(t => {
      const pct = Math.round((t.count / total) * 100);
      const badgeClass = t.tier === 'premium' ? 'badge-premium' : t.tier === 'professional' ? 'badge-professional' : 'badge-free';
      return `<div class="data-row">
        <span class="badge-tier ${badgeClass}">${t.tier}</span>
        <div style="flex:1;margin:0 12px"><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div></div>
        <span class="data-val">${t.count} (${pct}%)</span>
      </div>`;
    }).join('') || '<div class="data-row"><span class="data-key">No users yet</span></div>';

    // Query chart
    const days = d.queries.last_7_days;
    const maxQ  = Math.max(...days.map(d => parseInt(d.queries)), 1);
    document.getElementById('queryChart').innerHTML = days.map(d => {
      const h = Math.max(4, Math.round((parseInt(d.queries) / maxQ) * 56));
      return `<div class="chart-bar" title="${d.day}: ${d.queries} queries" style="height:${h}px"></div>`;
    }).join('');
    document.getElementById('queryChartLabels').innerHTML = days.map(d => {
      const label = new Date(d.day).toLocaleDateString('en-PK', { weekday: 'short' });
      return `<div class="chart-label" style="flex:1;text-align:center">${label}</div>`;
    }).join('');

    // Skills
    document.getElementById('skillsList').innerHTML = d.skills.top_30_days.map((s, i) => {
      const maxCount = d.skills.top_30_days[0]?.count || 1;
      const pct = Math.round((s.count / maxCount) * 100);
      return `<div class="data-row">
        <span class="data-key" style="width:200px;flex-shrink:0">${s.skill_used || 'unknown'}</span>
        <div style="flex:1;margin:0 12px"><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${i<3?'#66bb6a':'#2e7d32'}"></div></div></div>
        <span class="data-val">${s.count}</span>
      </div>`;
    }).join('') || '<div class="data-row"><span class="data-key">No data yet</span></div>';

    // Recent users
    document.getElementById('usersList').innerHTML = d.recent_users.map(u => {
      const badgeClass = u.tier === 'premium' ? 'badge-premium' : u.tier === 'professional' ? 'badge-professional' : 'badge-free';
      const joined = new Date(u.joined).toLocaleDateString('en-PK', { month: 'short', day: 'numeric' });
      return `<div class="data-row">
        <span class="data-key" style="flex:1">${u.email}</span>
        <span class="badge-tier ${badgeClass}" style="margin:0 12px">${u.tier}</span>
        <span class="data-val" style="min-width:80px;text-align:right">${joined}</span>
      </div>`;
    }).join('') || '<div class="data-row"><span class="data-key">No users yet</span></div>';

    // Subscriptions
    document.getElementById('subsList').innerHTML = d.revenue.active_subscriptions.length > 0
      ? d.revenue.active_subscriptions.map(s => `
        <div class="data-row">
          <span class="data-key">${s.provider === 'stripe' ? '💳 Stripe' : '📱 JazzCash'}</span>
          <span class="badge-tier ${s.tier === 'premium' ? 'badge-premium' : 'badge-professional'}">${s.tier}</span>
          <span class="data-val">${s.count} active</span>
        </div>`).join('')
      : '<div class="data-row"><span class="data-key" style="color:#4a7a5a">No active subscriptions yet</span></div>';

  } catch (err) {
    document.getElementById('loginErr').textContent = err.message;
  }
}

// Auto-login if key saved
if (_adminKey) loadDash();
</script>
</body>
</html>
