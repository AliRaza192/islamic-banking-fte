<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <title>Dashboard — Islamic Banking FTE</title>
    <style>
      body {
        background: var(--bg);
      }

      .dash-nav {
        background: var(--green-dark);
        color: white;
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .dash-nav-brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 700;
        text-decoration: none;
        color: white;
      }
      .dash-nav-links {
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      .dash-nav-links a {
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        font-size: 0.85rem;
      }
      .dash-nav-links a:hover {
        color: white;
      }

      .dash-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }

      .dash-greeting {
        margin-bottom: 2rem;
      }
      .dash-greeting h1 {
        color: var(--green-dark);
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
      }
      .dash-greeting p {
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .dash-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
        margin-bottom: 2rem;
      }

      .dash-card {
        background: var(--surface);
        border-radius: 14px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        padding: 1.5rem;
      }
      .dash-card-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
      }
      .dash-card-value {
        font-size: 2rem;
        font-weight: 800;
        color: var(--green-dark);
      }
      .dash-card-sub {
        font-size: 0.82rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
      }

      .dash-card.full-width {
        grid-column: 1 / -1;
      }

      .tier-display {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .tier-display .tier-badge {
        font-size: 0.85rem;
        padding: 0.3rem 0.75rem;
      }

      .usage-bar-container {
        background: var(--border);
        border-radius: 8px;
        height: 12px;
        overflow: hidden;
        margin: 0.75rem 0;
      }
      .usage-bar {
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--green-light),
          var(--green-mid)
        );
        border-radius: 8px;
        transition: width 0.5s ease;
      }
      .usage-bar.warn {
        background: linear-gradient(90deg, #f39c12, #e67e22);
      }
      .usage-bar.full {
        background: linear-gradient(90deg, #e74c3c, #c0392b);
      }

      .dash-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1rem;
      }
      .dash-btn {
        padding: 0.6rem 1.25rem;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.15s;
        border: none;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      .dash-btn.primary {
        background: var(--green-dark);
        color: white;
      }
      .dash-btn.primary:hover {
        background: var(--green-mid);
      }
      .dash-btn.outline {
        background: transparent;
        border: 1.5px solid var(--border);
        color: var(--text-primary);
      }
      .dash-btn.outline:hover {
        border-color: var(--green-mid);
        color: var(--green-dark);
      }
      .dash-btn.danger {
        background: transparent;
        border: 1.5px solid #e74c3c;
        color: #e74c3c;
      }
      .dash-btn.danger:hover {
        background: #e74c3c;
        color: white;
      }

      .account-info {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.5rem 1rem;
        font-size: 0.88rem;
      }
      .account-info dt {
        color: var(--text-muted);
      }
      .account-info dd {
        color: var(--text-primary);
        font-weight: 500;
      }

      .loading {
        text-align: center;
        padding: 3rem;
        color: var(--text-muted);
      }
      .loading .spinner {
        display: inline-block;
        width: 32px;
        height: 32px;
        border: 3px solid var(--border);
        border-top-color: var(--green-mid);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error-msg {
        text-align: center;
        padding: 2rem;
        color: #c0392b;
      }

      @media (max-width: 600px) {
        .dash-grid {
          grid-template-columns: 1fr;
        }
        .dash-greeting h1 {
          font-size: 1.25rem;
        }
        .dash-actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <nav class="dash-nav">
      <a href="/" class="dash-nav-brand">
        <span>🕌</span>
        <span>Islamic Banking FTE</span>
      </a>
      <div class="dash-nav-links">
        <a href="/pricing.html">Pricing</a>
        <a href="/">Chat</a>
      </div>
    </nav>

    <div class="dash-container" id="dashContent">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading your dashboard...</p>
      </div>
    </div>

    <script src="auth.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
