<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4731"/>
      <stop offset="100%" style="stop-color:#0d2818"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Crescent Moon -->
  <circle cx="256" cy="200" r="100" fill="url(#gold)"/>
  <circle cx="290" cy="180" r="80" fill="url(#bg)"/>
  <!-- Star -->
  <polygon points="256,120 266,155 300,155 272,175 282,210 256,190 230,210 240,175 212,155 246,155" fill="url(#gold)"/>
  <!-- Mosque Dome -->
  <path d="M180,340 Q256,260 332,340 L332,400 L180,400 Z" fill="url(#gold)" opacity="0.9"/>
  <!-- Minarets -->
  <rect x="155" y="300" width="20" height="100" fill="url(#gold)" opacity="0.8"/>
  <rect x="337" y="300" width="20" height="100" fill="url(#gold)" opacity="0.8"/>
  <!-- Minaret tops -->
  <circle cx="165" cy="295" r="12" fill="url(#gold)"/>
  <circle cx="347" cy="295" r="12" fill="url(#gold)"/>
  <!-- Door -->
  <path d="M236,400 L236,360 Q256,340 276,360 L276,400 Z" fill="#0d2818"/>
  <!-- Text -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="36" fill="url(#gold)">IB FTE</text>
</svg>
